# Fast feedback gate — runs on cheap ubuntu runners in ~3 minutes.
# Catches compile errors, verifier-logic regressions, and assertion-coverage
# drift BEFORE any expensive macOS simulator job is dispatched.
name: Static Checks (fast gate)

on:
  push:
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'testng*.xml'
      - 'scripts/**'
      - '.github/scripts/**'
      - '.github/workflows/static-checks.yml'
  pull_request:
  workflow_dispatch:

concurrency:
  group: static-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-and-selftest:
    name: Compile + verifier self-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # framework code only — skip the large app-source tree
          sparse-checkout: |
            src
            pom.xml
            testng*.xml
            scripts
          sparse-checkout-cone-mode: false

      # A malformed suite is not a compile error: surefire reports "Tests run: 0" and the
      # macOS job only goes red at its result gate, after ~10 min of simulator setup
      # (run 36979724116: a '--' inside an XML comment in testng-zp3927-3928.xml).
      - name: TestNG suite XML is well-formed
        run: |
          python3 -m pip install --quiet --break-system-packages defusedxml \
            || python3 -m pip install --quiet defusedxml
          python3 - <<'EOF'
          import glob, sys
          import defusedxml.minidom
          files = sorted(set(glob.glob('testng*.xml') + glob.glob('src/test/resources/**/*.xml', recursive=True)))
          bad = []
          for f in files:
              try:
                  defusedxml.minidom.parse(f)
              except Exception as e:
                  bad.append(f"{f}: {e}")
          print(f"checked {len(files)} suite XML files, {len(bad)} malformed")
          for b in bad:
              print(f"::error::{b}")
          sys.exit(1 if bad else 0)
          EOF

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Compile (main + tests)
        run: mvn -B -q -DskipTests test-compile

      - name: Verifier self-tests (driver-free, must go RED on injected defects)
        run: mvn -B -DsuiteXmlFile=testng-verify-selftest.xml test

      - name: Defect-report generator self-test (synthetic artifacts → PDF)
        run: |
          python3 -m pip install --quiet --break-system-packages reportlab pillow defusedxml \
            || python3 -m pip install --quiet reportlab pillow defusedxml
          python3 .github/scripts/generate_bug_report.py --selftest

  assertion-coverage:
    name: Assertion-coverage gate (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Non-blocking for now: the repo currently has 177 NEW pass-anyway tests
    # beyond the 291-test baseline. Flip continue-on-error to false once that
    # regression list is burned down.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            src
            scripts
          sparse-checkout-cone-mode: false
      - name: Check new tests carry real assertions
        run: python3 scripts/check_assertion_coverage.py --strict
